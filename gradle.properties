# La machine a 8 Go partagés entre Windows et WSL, et il en reste
# souvent moins d'un et demi de libre. Sans plafond, le démon Gradle et
# celui de Kotlin prennent chacun ce qu'ils veulent, et une construction
# finit tuée par le système sans message clair.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# Le compilateur Kotlin dans le démon Gradle plutôt que dans un démon à
# lui : une JVM de moins en mémoire. Un peu plus lent sur un gros
# projet, sans importance sur celui-ci.
kotlin.compiler.execution.strategy=in-process

# Rendre la mémoire après dix minutes d'inactivité, plutôt que trois heures.
org.gradle.daemon.idletimeout=600000

org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.code.style=official
